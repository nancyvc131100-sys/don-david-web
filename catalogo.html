<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo - Licorería Don David</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div id="mini-header"></div>

<section class="container my-5">

    <a href="index.html" class="btn btn-outline-dark btn-sm mb-3">← Volver al inicio</a>
    <h1 class="text-center mb-4">🛍️ Catálogo completo</h1>

    <div class="catalogo-buscador mx-auto mb-4">
        <input type="text" id="buscadorCatalogo" class="form-control" placeholder="Buscar un producto...">
    </div>

    <div class="pildoras-categoria" id="filtrosCategoria">
        <!-- JS: renderizarFiltrosCategoria() en script.js -->
    </div>

    <div class="row g-4 mt-2" id="grillaCatalogo">
        <!-- JS: renderizarCatalogo() en script.js -->
    </div>

    <div id="catalogoSinResultados" class="text-center text-secondary py-5" style="display:none;">
        <i class="bi bi-search" style="font-size:2.5rem;"></i>
        <p class="mt-2">No encontramos productos con ese filtro.<br>Prueba con otra categoría o búsqueda.</p>
    </div>

</section>

<div id="widgets-compartidos"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<!-- Supabase (opcional, ver script.js) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/partials.js"></script>
<script src="js/carrito.js"></script>
<script src="js/calculadora.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/producto.js"></script>
<script src="js/script.js"></script>

</body>

</html>
