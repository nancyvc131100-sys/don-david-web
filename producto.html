<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Producto - Licorería Don David</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div id="mini-header"></div>

<!-- Esta sección se llena con JS (renderizarPaginaProducto en script.js)
     según el ?id= que traiga la URL. Es UNA sola plantilla para
     cualquier producto, en vez de un archivo .html por cada uno. -->
<section class="container my-5" id="pp-contenido">

    <div class="row align-items-center">

        <div class="col-md-6">
            <img id="pp-imagen" src="" class="img-fluid rounded shadow producto-img" alt="">
        </div>

        <div class="col-md-6">

            <h1 id="pp-nombre"></h1>

            <p class="text-warning fs-3">★★★★★</p>

            <h3 id="pp-precio"></h3>

            <p id="pp-descripcion"></p>

            <h5>Características:</h5>
            <ul>
                <li>Producto original</li>
                <li>Presentación premium</li>
                <li>Excelente opción para regalo</li>
            </ul>

            <div class="producto-acciones mt-3">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <label class="mb-0">Cantidad:</label>
                    <button type="button" class="btn-qty" onclick="ajustarInputCantidad(this, -1)">−</button>
                    <input type="number" class="input-cantidad" value="1" min="1">
                    <button type="button" class="btn-qty" onclick="ajustarInputCantidad(this, 1)">+</button>
                </div>

                <button type="button" class="btn btn-warning btn-agregar-carrito" id="pp-btn-agregar">
                    🛒 Agregar al carrito
                </button>

            </div>

            <br>

            <a id="pp-whatsapp" href="#" class="btn btn-producto" target="_blank">
    <i class="bi bi-whatsapp"></i> COMPRAR YA!
</a>


            <br><br>

            <a href="index.html" class="btn btn-secondary">← Volver a productos</a>

        </div>

    </div>

</section>

<div id="pp-no-encontrado" class="container my-5 text-center py-5" style="display:none;">
    <i class="bi bi-emoji-frown" style="font-size:3rem;"></i>
    <h2 class="mt-3">Producto no encontrado</h2>
    <p>El producto que buscas no existe o fue removido.</p>
    <a href="catalogo.html" class="btn btn-warning">Ver catálogo completo</a>
</div>

<div id="widgets-compartidos"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<!-- Supabase (opcional, ver script.js) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="partials.js"></script>
<script src="script.js"></script>

</body>

</html>
