<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel - Licorería Don David</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="admin-shell d-flex" id="panelContenido" style="display:none !important;">

    <!-- Offcanvas responsivo: barra lateral fija en pantalla ancha,
         panel desplegable con botón de hamburguesa en celular.
         Es el mismo componente de Bootstrap que ya usa el carrito,
         solo que "offcanvas-md" lo vuelve fijo desde tablet/desktop. -->
    <div class="offcanvas-md offcanvas-start admin-sidebar" tabindex="-1" id="sidebarAdmin">

        <div class="offcanvas-header">
            <span class="fw-bold">🍺 Panel Don David</span>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarAdmin"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column">
            <nav class="nav flex-column flex-grow-1">
                <a href="#" class="admin-nav-item activo"><i class="bi bi-box-seam"></i> Productos</a>
                <a href="#" class="admin-nav-item deshabilitado" onclick="return alertaProximamente()"><i class="bi bi-receipt"></i> Pedidos y ventas</a>
                <a href="#" class="admin-nav-item deshabilitado" id="navConfig" onclick="return alertaProximamente()"><i class="bi bi-gear"></i> Configuración</a>
            </nav>
        </div>

    </div>

    <div class="flex-grow-1">

        <div class="admin-topbar d-flex justify-content-between align-items-center">
            <button type="button" class="btn d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarAdmin">
                <i class="bi bi-list" style="font-size:22px;"></i>
            </button>
            <span class="text-secondary" id="panelSaludo" style="font-size:14px;"></span>
            <button type="button" class="btn btn-outline-dark btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>

        <div class="container-fluid p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Productos</h5>
                <button type="button" class="admin-btn-nuevo" onclick="abrirModalProducto()">
                    <i class="bi bi-plus-lg"></i> Nuevo producto
                </button>
            </div>

            <div class="d-flex gap-2 mb-4" id="pildorasProductosPanel" style="overflow-x:auto;">
                <!-- JS: renderizarPildorasPanel() en productos.js -->
            </div>

            <div id="productosPanelCargando" class="text-secondary" style="font-size:13px;">Cargando productos...</div>
            <div id="productosPanelVacio" class="text-secondary text-center py-5" style="display:none;">
                <i class="bi bi-inbox" style="font-size:2rem;"></i>
                <p class="mt-2">No hay productos en esta vista.</p>
            </div>

            <div class="row g-3" id="grillaProductosPanel">
                <!-- JS: renderizarGrillaProductosPanel() en productos.js -->
            </div>

        </div>

    </div>

</div>

<!-- MODAL: crear / editar producto -->
<div class="modal fade" id="modalProducto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formProducto" onsubmit="guardarProducto(event)">
        <div class="modal-header">
          <h5 class="modal-title" id="modalProductoTitulo">Nuevo producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">

          <input type="hidden" id="fpId">
          <input type="hidden" id="fpImagenActual">

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" id="fpNombre" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-select" id="fpCategoria" required>
              <option value="cerveza">Cerveza</option>
              <option value="whisky">Whisky</option>
              <option value="ron">Ron</option>
              <option value="vodka">Vodka</option>
              <option value="pisco">Pisco</option>
              <option value="tequila">Tequila</option>
              <option value="vino">Vino</option>
              <option value="espumante">Espumante</option>
              <option value="energizante">Energizante</option>
              <option value="gaseosa">Gaseosa</option>
              <option value="agua">Agua</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Precio (S/)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="fpPrecio" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" id="fpDescripcion" rows="2"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Foto</label>
            <input type="file" class="form-control" id="fpImagen" accept="image/*">
            <img id="fpImagenPreview" style="display:none; max-width:90px; margin-top:8px; border-radius:8px;" alt="Vista previa">
          </div>

          <hr>
          <p class="text-secondary mb-2" style="font-size:13px;">Opciones avanzadas</p>

          <div class="mb-3">
            <label class="form-label">Etiqueta</label>
            <select class="form-select" id="fpEtiqueta">
              <option value="">Ninguna</option>
              <option value="mas_vendido">Más vendido</option>
              <option value="recomendado">Recomendado</option>
              <option value="nuevo">Nuevo</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Precio de oferta (opcional)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="fpPrecioOferta">
          </div>

          <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="fpCarrusel">
            <label class="form-check-label" for="fpCarrusel">Mostrar en el carrusel de inicio</label>
          </div>

          <div id="formProductoError" class="alert alert-danger py-2 mt-2" style="display:none; font-size:13px;"></div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger me-auto" id="btnMoverPapelera" style="display:none;" onclick="moverAPapeleraDesdeModal()">
            <i class="bi bi-trash"></i> Mover a papelera
          </button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dark" id="btnGuardarProducto">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="admin.js"></script>
<script src="productos.js"></script>
<script>
  function alertaProximamente() {
    alert("Esta sección todavía no está construida — llega en el siguiente paso.");
    return false;
  }

  exigirSesion().then(function (perfil) {
    if (!perfil) return; // exigirSesion ya redirigió a login.html
    document.getElementById("panelSaludo").textContent = perfil.nombre + " (" + perfil.rol + ")";
    document.getElementById("panelContenido").style.display = "flex";

    // Solo el administrador ve Configuración — coincide con la
    // tabla de permisos que definimos juntos.
    if (perfil.rol !== "administrador") {
      document.getElementById("navConfig").style.display = "none";
    }

    inicializarProductosPanel();
  });
</script>

</body>

</html>
