<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restablecer contraseña - Licorería Don David</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="admin-login-fondo d-flex align-items-center justify-content-center">

    <div class="admin-login-card">

        <div class="text-center mb-4">
            <div style="font-size:40px;">🍺</div>
            <h4 class="fw-bold mt-2">Licorería <strong>Don David</strong></h4>
            <p class="text-secondary mb-0">Elige tu nueva contraseña</p>
        </div>

        <form id="formRestablecer">

            <div class="mb-3">
                <label class="form-label" for="nuevaContrasena">Nueva contraseña</label>
                <input type="password" id="nuevaContrasena" class="form-control" minlength="6" required autocomplete="new-password">
            </div>

            <div id="restablecerError" class="alert alert-danger py-2" style="display:none; font-size:13px;"></div>
            <div id="restablecerExito" class="alert alert-success py-2" style="display:none; font-size:13px;"></div>

            <button type="submit" class="btn btn-dark w-100" id="btnRestablecer">Guardar nueva contraseña</button>

        </form>

        <div class="text-center mt-3">
            <a href="login.html" class="text-secondary" style="font-size:13px; text-decoration:none;">← Volver al login</a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="admin.js"></script>
<script src="restablecer.js"></script>

</body>

</html>
