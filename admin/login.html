<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel - Licorería Don David</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="admin-login-fondo d-flex align-items-center justify-content-center">

    <div class="admin-login-card">

        <div class="text-center mb-4">
            <span class="logo-icon" style="font-size:40px;">🍺</span>
            <h4 class="mt-2 mb-0">Licorería <strong>Don David</strong></h4>
            <p class="text-secondary" style="font-size:14px;">Panel de administración</p>
        </div>

        <form id="formLogin" onsubmit="iniciarSesion(event)">

            <div class="mb-3">
                <label class="form-label" for="loginEmail">Correo</label>
                <input type="email" id="loginEmail" class="form-control" required autocomplete="username">
            </div>

            <div class="mb-3">
                <label class="form-label" for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" class="form-control" required autocomplete="current-password">
            </div>


            <div id="loginError" class="alert alert-danger py-2" style="display:none; font-size:14px;"></div>
            <div id="recuperacionExito" class="alert alert-success py-2" style="display:none; font-size:13px;"></div>

            <button type="submit" class="btn btn-dark w-100" id="btnIniciarSesion">Ingresar</button>

            <div class="text-center mt-2">
                <a href="#" onclick="return enviarRecuperacion()" style="font-size:13px; color:#6c757d;">¿Olvidaste tu contraseña?</a>
            </div>

        </form>

        <div class="text-center mt-3">
            <a href="../index.html" class="text-secondary" style="font-size:13px; text-decoration:none;">← Volver al sitio</a>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="admin.js"></script>

</body>

</html>
